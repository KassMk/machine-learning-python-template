<!DOCTYPE html>
<html>
<head>
    <title>Iris Classifier</title>
</head>
<body>
    <h2>Clasificador de Flores Iris</h2>
    <form method="post">
        Sépal Length: <input type="number" step="any" name="sepal_length" required><br>
        Sépal Width: <input type="number" step="any" name="sepal_width" required><br>
        Petal Length: <input type="number" step="any" name="petal_length" required><br>
        Petal Width: <input type="number" step="any" name="petal_width" required><br>
        <br>
        <button type="submit">Predecir</button>
    </form>

    {% if prediction %}
        <h3>Predicción: {{ prediction }}</h3>
    {% endif %}
</body>
</html>
